<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Employer Wage Tool · Concepts</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+Pro:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
  html, body { margin:0; padding:0; height:100%; background:#f0eee9; }
  body { font-family: "Inter", system-ui, sans-serif; color:#1b2536; }
  #root { width:100%; height:100%; }

  #tweaks {
    position: fixed; bottom: 16px; right: 16px; z-index: 100;
    background: #fff; border:1px solid #dfe2e8; border-radius: 8px;
    padding: 14px 16px; font-family: "Inter", system-ui, sans-serif; font-size: 12px;
    box-shadow: 0 6px 22px rgba(0,0,0,.12);
    display:none; width: 256px;
  }
  #tweaks.on { display:block; }
  #tweaks h4 { margin:0 0 10px; font-family:"Source Serif Pro", Georgia, serif; font-size:15px; font-weight:700; }
  #tweaks .group { margin-bottom: 12px; }
  #tweaks .group:last-child { margin-bottom: 0; }
  #tweaks .grouplbl { font-size:10px; color:#727a89; text-transform:uppercase; letter-spacing:0.8px; margin-bottom:6px; }
  #tweaks .btnrow { display:flex; flex-wrap:wrap; gap:6px; }
  #tweaks button.opt {
    border:1px solid #d2d7df; background:#fff; border-radius:6px;
    padding:5px 9px; font:inherit; font-size:11px; cursor:pointer; color:#27303f; text-align:left;
  }
  #tweaks button.opt.on { background:#1b2536; color:#fff; border-color:#1b2536; }
  #tweaks .sliderrow { display:flex; align-items:center; gap:8px; }
  #tweaks input[type=range] { flex:1; accent-color:#34537d; }
  #tweaks .out { font-family:"Source Serif Pro", serif; font-weight:600; font-size:13px; min-width:62px; text-align:right; color:#34537d; }
  #tweaks .hint { font-size:10px; color:#9aa1ad; margin-top:8px; line-height:1.3; }
</style>
</head>
<body>
<div id="root"></div>

<div id="tweaks">
  <h4>Tweaks</h4>

  <div class="group">
    <div class="grouplbl">Industry (NAICS) — affects summary band only</div>
    <div class="btnrow">
      <button class="opt ind on" data-ind="62: Health Care &amp; Social Assistance">Health Care</button>
      <button class="opt ind"    data-ind="54: Professional, Scientific &amp; Technical">Prof &amp; Tech</button>
      <button class="opt ind"    data-ind="52: Finance &amp; Insurance">Finance</button>
      <button class="opt ind"    data-ind="31–33: Manufacturing">Manufacturing</button>
      <button class="opt ind"    data-ind="92: Public Administration">Public Admin</button>
    </div>
  </div>

  <div class="group">
    <div class="grouplbl">Job family (SOC-3)</div>
    <div class="btnrow">
      <button class="opt fam on" data-fam="43-3000 · Financial Clerks">43-3000 Financial Clerks</button>
      <button class="opt fam"    data-fam="43-4000 · Information &amp; Record Clerks">43-4000 Info Clerks</button>
      <button class="opt fam"    data-fam="15-1200 · Computer Occupations">15-1200 Computer</button>
      <button class="opt fam"    data-fam="21-1000 · Counselors &amp; Social Workers">21-1000 Counselors</button>
    </div>
  </div>

  <div class="group">
    <div class="grouplbl">Region</div>
    <div class="btnrow">
      <button class="opt reg on" data-reg="Virginia">Virginia</button>
      <button class="opt reg"    data-reg="Virginia Beach–Norfolk">Va. Beach</button>
      <button class="opt reg"    data-reg="Northern Virginia">N. Virginia</button>
    </div>
  </div>

  <div class="group">
    <div class="grouplbl">Your planned wage (Option A only)</div>
    <div class="sliderrow">
      <input id="wage" type="range" min="24000" max="120000" step="1000" value="48000">
      <span class="out" id="wageOut">$48,000</span>
    </div>
  </div>

  <div class="group">
    <div class="grouplbl">Target percentile (Option B)</div>
    <div class="sliderrow">
      <input id="target" type="range" min="10" max="90" step="5" value="60">
      <span class="out" id="targetOut">60th</span>
    </div>
  </div>

  <div class="hint">Industry drives the new top summary band on Option B; it never affects the occupation pay bands (industry × occupation data is suppressed).</div>
</div>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="employer-data.jsx"></script>
<script type="text/babel" src="employer-views.jsx"></script>
<script type="text/babel" src="employer-app.jsx"></script>
</body>
</html>
